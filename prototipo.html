<style>
/* Layout: portal público tipo WordPress + consola administrativa con barra lateral; ambos comparten tokens. */
:root{
  --bg:#F4F7F6; --surface:#FFFFFF; --sunken:#EAF1EF; --fg:#13211F; --muted:#566966; --line:#D3DFDC;
  --primary:#0B5D57; --primary-ink:#FFFFFF; --primary-soft:#DDEDEA; --focus:#AD6A00;
  --ok:#1D7438; --ok-soft:#DFF1E4; --warn:#9A5B00; --warn-soft:#FBEBD0; --crit:#B42318; --crit-soft:#FBE1DE;
  --info:#2456A6; --info-soft:#E1EAF8; --proto:#3B2F63; --proto-ink:#F2EEFF;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "Cascadia Mono", monospace;
  --r:10px; --r-sm:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1716; --surface:#152220; --sunken:#1B2C29; --fg:#E4EEEC; --muted:#9DB2AE; --line:#2A3D3A;
  --primary:#5CC2B6; --primary-ink:#06201D; --primary-soft:#1D3C38; --focus:#F2B544;
  --ok:#6FCF8C; --ok-soft:#173826; --warn:#F0B35A; --warn-soft:#3A2A10; --crit:#FF8A7E; --crit-soft:#401C19;
  --info:#8DB3F2; --info-soft:#1A2A45; --proto:#2A2347; --proto-ink:#E4DCFF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1716; --surface:#152220; --sunken:#1B2C29; --fg:#E4EEEC; --muted:#9DB2AE; --line:#2A3D3A;
  --primary:#5CC2B6; --primary-ink:#06201D; --primary-soft:#1D3C38; --focus:#F2B544;
  --ok:#6FCF8C; --ok-soft:#173826; --warn:#F0B35A; --warn-soft:#3A2A10; --crit:#FF8A7E; --crit-soft:#401C19;
  --info:#8DB3F2; --info-soft:#1A2A45; --proto:#2A2347; --proto-ink:#E4DCFF; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:16px/1.55 var(--f-body);margin:0}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.15;margin:0}
h1{font-size:clamp(1.6rem,4vw,2.3rem);font-weight:800}
h2{font-size:1.35rem;font-weight:800}
h3{font-size:1.05rem;font-weight:600}
p{margin:0}
a{color:var(--primary)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Banda de prototipo */
.proto{background:var(--proto);color:var(--proto-ink);font-size:.86rem}
.proto .wrap{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding-block:8px}
.seg{display:inline-flex;border:1px solid color-mix(in srgb,var(--proto-ink) 40%,transparent);border-radius:999px;overflow:hidden}
.seg button{background:transparent;border:0;color:var(--proto-ink);padding:6px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--proto-ink);color:var(--proto)}

/* Botones y formularios */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;text-decoration:none;color:var(--fg)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn.small{min-height:36px;padding:0 12px;font-size:.92rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.field{display:grid;gap:6px}
.field label{font-weight:700}
.field .hint{font-size:.88rem;color:var(--muted)}
.err{font-size:.9rem;color:var(--crit);font-weight:700}
.field{align-content:start}
.err-sum{border:2px solid var(--crit);background:var(--crit-soft);border-radius:var(--r-sm);padding:14px 16px;display:grid;gap:6px}
.err-sum ul{margin:0;padding-left:20px}
.err-sum a{color:var(--crit);font-weight:700}
input[type=text],input[type=email],input[type=tel],input[type=date],input[type=password],input[type=number],select,textarea{
  width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface)}
textarea{min-height:120px;resize:vertical}
[aria-invalid="true"]{border-color:var(--crit)!important;box-shadow:0 0 0 1px var(--crit)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.check{display:flex;gap:10px;align-items:flex-start}
.check input{width:22px;height:22px;margin-top:2px;flex:none}

/* Chips de estado y semáforo */
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:.84rem;font-weight:700;white-space:nowrap}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.s-VERDE{background:var(--ok-soft);color:var(--ok)}
.s-AMARILLO{background:var(--warn-soft);color:var(--warn)}
.s-ROJO{background:var(--crit-soft);color:var(--crit)}
.e-INGRESADO{background:var(--info-soft);color:var(--info)}
.e-EN_PROCESO{background:var(--warn-soft);color:var(--warn)}
.e-RESPONDIDO{background:var(--ok-soft);color:var(--ok)}
.e-CERRADO{background:var(--sunken);color:var(--muted)}

/* ===== Portal ciudadano ===== */
.site-head{background:var(--surface);border-bottom:1px solid var(--line)}
.site-head .wrap{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;padding-block:14px}
.brand{display:flex;gap:12px;align-items:center;text-decoration:none;color:var(--fg)}
.brand-mark{width:42px;height:42px;border-radius:50%;background:var(--primary);display:grid;place-items:center;color:var(--primary-ink);font-family:var(--f-display);font-weight:800}
.brand small{display:block;color:var(--muted);font-size:.82rem}
.site-nav{display:flex;flex-wrap:wrap;gap:4px}
.site-nav button{background:none;border:0;padding:10px 12px;border-radius:var(--r-sm);cursor:pointer;font-weight:700;color:var(--fg)}
.site-nav button[aria-current="page"]{background:var(--primary-soft);color:var(--primary)}
.hero{background:var(--primary);color:var(--primary-ink)}
.hero .wrap{padding-block:36px;display:grid;gap:14px}
.hero p{max-width:60ch;font-size:1.08rem}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:-28px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:grid;gap:8px;text-align:left;cursor:pointer;color:var(--fg)}
.tile:hover{border-color:var(--primary)}
.tile .ico{width:40px;height:40px;border-radius:var(--r-sm);background:var(--primary-soft);color:var(--primary);display:grid;place-items:center}
.section{padding-block:32px;display:grid;gap:18px}
.news{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.news article{border-top:3px solid var(--primary);background:var(--surface);padding:16px;display:grid;gap:6px}
.news time{font-size:.85rem;color:var(--muted)}
.tipo-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.tipo{border:2px solid var(--line);border-radius:var(--r);padding:16px;background:var(--surface);cursor:pointer;text-align:left;display:grid;gap:4px;color:var(--fg)}
.tipo[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft)}
.tipo b{font-family:var(--f-display);font-size:1.05rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px;display:grid;gap:18px}
.steps{display:flex;gap:8px;flex-wrap:wrap;font-size:.9rem;color:var(--muted)}
.steps span[aria-current="step"]{color:var(--primary);font-weight:700}
.escala{display:flex;gap:6px;flex-wrap:wrap}
.escala button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700}
.escala button[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.escala-leyenda{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);max-width:350px}
.folio{font-family:var(--f-mono);font-size:1.6rem;letter-spacing:.04em;color:var(--primary)}
.estab-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.estab-list article{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:6px}
.site-foot{border-top:1px solid var(--line);background:var(--surface);margin-top:24px}
.site-foot .wrap{padding-block:20px;display:flex;flex-wrap:wrap;gap:12px 32px;font-size:.9rem;color:var(--muted)}

/* ===== Consola administrativa ===== */
.app{display:grid;grid-template-columns:240px 1fr;min-height:calc(100dvh - 52px)}
.side{background:var(--surface);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:6px}
.side .who{padding:10px;border-radius:var(--r-sm);background:var(--sunken);font-size:.88rem;margin-bottom:10px}
.side .who b{display:block;font-size:.95rem}
.side button.nav{background:none;border:0;text-align:left;padding:10px 12px;border-radius:var(--r-sm);cursor:pointer;font-weight:700;color:var(--fg);display:flex;gap:10px;align-items:center}
.side button.nav[aria-current="page"]{background:var(--primary-soft);color:var(--primary)}
.side .spacer{flex:1}
.main{padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:20px;align-content:start;min-width:0}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.toolbar .field{min-width:160px;flex:1}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:2px;text-align:left;color:var(--fg)}
button.kpi{cursor:pointer}
button.kpi[aria-pressed="true"]{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
.m-who{display:none}
.kpi .v{font-family:var(--f-display);font-size:1.9rem;font-weight:800;font-variant-numeric:tabular-nums}
.kpi .l{font-size:.86rem;color:var(--muted)}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:.94rem}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--sunken)}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--sunken)}
.cards{display:none}
.detail{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:12px;align-content:start}
dl.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;margin:0}
dl.kv dt{color:var(--muted)}
dl.kv dd{margin:0;font-weight:700}
.timeline{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.timeline li{border-left:3px solid var(--primary);padding-left:12px}
.timeline time{font-size:.84rem;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.notice{padding:12px 14px;border-radius:var(--r-sm);background:var(--info-soft);color:var(--info);font-weight:700}
.notice.warn{background:var(--warn-soft);color:var(--warn)}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:1fr 44px;gap:2px 10px;align-items:center;font-size:.92rem}
.bar > span:first-child{grid-column:1 / -1}
.bar .track{display:block;height:14px;background:var(--sunken);border-radius:999px;overflow:hidden}
.bar .fill{display:block;height:100%;background:var(--primary);border-radius:999px}
.bar .n{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.estab-panel{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.login{min-height:calc(100% - 44px);display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.login .panel{width:min(440px,100%)}
.demo-users{display:grid;gap:8px}
.demo-users button{text-align:left}
dialog{border:1px solid var(--line);border-radius:var(--r);padding:0;width:min(560px,calc(100% - 32px));background:var(--surface);color:var(--fg)}
dialog::backdrop{background:rgba(5,15,14,.55)}
dialog form{padding:22px;display:grid;gap:14px}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:var(--r-sm);font-weight:700;max-width:min(420px,calc(100% - 32px));z-index:30}
.mobile-nav{display:none}

@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .mobile-nav{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto;gap:4px;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
  .mobile-nav button{white-space:nowrap;background:none;border:0;padding:8px 12px;border-radius:999px;font-weight:700;color:var(--fg)}
  .mobile-nav button[aria-current="page"]{background:var(--primary-soft);color:var(--primary)}
  .detail{grid-template-columns:1fr}
  .kpis{grid-template-columns:1fr 1fr;gap:8px}
  .kpi{padding:10px 12px}
  .kpi .v{font-size:1.4rem}
  .tipo-grid{grid-template-columns:1fr 1fr;gap:8px}
  .tipo{padding:12px}
  .tipo .muted{font-size:.85rem}
  .m-who{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));font-size:.88rem;background:var(--surface)}
  .proto{font-size:.8rem}
  .tbl-wrap.resp{display:none}
  .cards{display:grid;gap:10px}
  .cards article{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:6px;cursor:pointer}
  .cards .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:space-between}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
/* ================= Datos y reglas ================= */
const FERIADOS = new Set(['2026-01-01','2026-04-03','2026-04-04','2026-05-01','2026-05-21','2026-06-21','2026-06-29','2026-07-16','2026-08-15','2026-09-18','2026-09-19','2026-10-12','2026-10-31','2026-11-01','2026-12-08','2026-12-25','2027-01-01','2027-03-26','2027-03-27','2027-05-01','2027-05-21','2027-06-21','2027-06-28','2027-07-16','2027-08-15','2027-09-17','2027-09-18','2027-09-19','2027-10-11','2027-10-31','2027-11-01','2027-12-08','2027-12-25']);
const iso = d => d.toISOString().slice(0,10);
const parse = s => new Date(s+'T12:00:00Z');
const habil = d => { const w=d.getUTCDay(); return w!==0 && w!==6 && !FERIADOS.has(iso(d)); };
function sumarHabiles(desde,n){ const d=parse(desde); let c=0; while(c<n){ d.setUTCDate(d.getUTCDate()+1); if(habil(d)) c++; } return iso(d); }
function restantes(hoy,venc){ if(hoy===venc) return 0; const paso = venc>hoy?1:-1; const d=parse(hoy); let c=0; while(iso(d)!==venc){ d.setUTCDate(d.getUTCDate()+paso); if(habil(d)) c+=paso; } return c; }
const semaforo = r => r<0?'ROJO':(r<=5?'AMARILLO':'VERDE');
const HOY = iso(new Date(Date.UTC(new Date().getFullYear(), new Date().getMonth(), new Date().getDate(), 12)));
function haceHabiles(n){ const d=parse(HOY); let c=0; while(c<n){ d.setUTCDate(d.getUTCDate()-1); if(habil(d)) c++; } return iso(d); }

const ESTABS = [
  {cod:'CESFAM-PLC', nombre:'CESFAM Padre Las Casas', horario:'Lun a jue 08:00–17:00 · vie 08:00–16:00', tipo:'CESFAM'},
  {cod:'CESFAM-PUL', nombre:'CESFAM Pulmahue', horario:'Lun a jue 08:00–17:00 · vie 08:00–16:00', tipo:'CESFAM'},
  {cod:'CESFAM-CON', nombre:'CESFAM Conunhuenu', horario:'Lun a jue 08:00–17:00 · vie 08:00–16:00', tipo:'CESFAM'},
  {cod:'SAPU-PLC', nombre:'SAPU Padre Las Casas', horario:'Lun a vie 17:00–24:00 · sáb, dom y festivos 08:00–24:00', tipo:'SAPU'},
  {cod:'PSR-01', nombre:'Posta de Salud Rural (ejemplo)', horario:'Rondas según calendario del sector', tipo:'Posta rural'},
];
const nombreEst = c => (ESTABS.find(e=>e.cod===c)||{}).nombre || c;
const CATEGORIAS = ['Calidad de la atención','Tiempos de espera','Trato recibido','Presentación del personal','Información e indicaciones','Infraestructura y equipamiento','Gestión administrativa','Otro'];
const UNIDADES = ['Dirección','SOME','Sector Azul','Sector Rojo','Farmacia','Dental','Urgencia'];
const TIPOS = {
  RECLAMO:{t:'Reclamo', d:'Algo no funcionó como esperaba', id:true},
  SUGERENCIA:{t:'Sugerencia', d:'Una idea para mejorar', id:false},
  CONSULTA:{t:'Consulta', d:'Necesito información', id:true},
  SOLICITUD:{t:'Solicitud', d:'Pido un trámite o gestión', id:true},
  FELICITACION:{t:'Felicitación', d:'Quiero reconocer una buena atención', id:false},
};
const ESTADO_TXT = {INGRESADO:'Ingresado', EN_PROCESO:'En proceso', RESPONDIDO:'Respondido', CERRADO:'Cerrado'};
const PREGUNTAS = [
  {id:'p1', t:'Calidad de la atención recibida'}, {id:'p2', t:'Tiempo de espera'}, {id:'p3', t:'Trato recibido'},
  {id:'p4', t:'Presentación e identificación del personal'}, {id:'p5', t:'Claridad de las indicaciones'},
];
const USUARIOS = [
  {email:'admin@dsm.cl', nombre:'Ana Morales', rol:'ADMIN', rolTxt:'Administradora del sistema', est:null, activo:true, mfa:true},
  {email:'oirs.dsm@dsm.cl', nombre:'Daniel Fuentes', rol:'OIRS_DSM', rolTxt:'Encargado OIRS Departamento', est:null, activo:true, mfa:true},
  {email:'oirs.plc@dsm.cl', nombre:'Olga Huenchumán', rol:'OIRS_EST', rolTxt:'Encargada OIRS', est:'CESFAM-PLC', activo:true, mfa:false},
  {email:'dir.plc@dsm.cl', nombre:'Diana Rivas', rol:'DIRECCION', rolTxt:'Directora de establecimiento', est:'CESFAM-PLC', activo:true, mfa:false},
  {email:'oirs.pul@dsm.cl', nombre:'Pedro Catrileo', rol:'OIRS_EST', rolTxt:'Encargado OIRS', est:'CESFAM-PUL', activo:true, mfa:false},
];
const PERM = {
  ver:['ADMIN','OIRS_DSM','OIRS_EST','DIRECCION'], gestionar:['OIRS_EST'], ingresar:['OIRS_EST'], panel:['OIRS_DSM','ADMIN'],
  reportes:['OIRS_DSM','OIRS_EST','DIRECCION'], exportar:['OIRS_DSM'], usuarios:['ADMIN'],
};
const puede = (u,a) => PERM[a].includes(u.rol);

let correlativo = 1158;
const nuevoFolio = () => `PLC-${HOY.slice(0,4)}-${String(++correlativo).padStart(6,'0')}`;
function req(folio,tipo,est,diasAtras,estado,desc,cat,unidad,sol){
  const ingreso = haceHabiles(diasAtras);
  const r = {folio,tipo,est,ingreso,vence:sumarHabiles(ingreso,15),estado,desc,cat:cat||null,unidad:unidad||null,canal:diasAtras%2?'WEB':'PRESENCIAL',
    sol: sol||null, historial:[{f:ingreso,a:'Ingreso',e:'INGRESADO',u:'Sistema (canal '+(diasAtras%2?'web':'presencial')+')'}], respuesta:null};

    <div class="kpi"><span class="v">9,4</span><span class="l">Días hábiles promedio de respuesta</span></div>

    <section class="box"><h3>Por estado</h3>${barras(Object.keys(ESTADO_TXT).map(k=>[ESTADO_TXT[k], base.filter(r=>r.estado===k).length]))}</section>
    <section class="box"><h3>Principales motivos</h3>${barras(cnt(base.filter(r=>r.cat),r=>r.cat).slice(0,6))}</section>
    ${u.est?'':`<section class="box"><h3>Por establecimiento</h3>${barras(cnt(base,r=>nombreEst(r.est)))}</section>`}
    ${u.est?'':`<section class="box"><h3>Satisfacción por establecimiento (1 a 7)</h3><div class="bars">${ESTABS.map(e=>`<div class="bar"><span>${esc(e.nombre)}</span><span class="track"><span class="fill" style="width:${(ENCUESTAS.porEst[e.cod]/7*100).toFixed(0)}%"></span></span><span class="n">${dec(ENCUESTAS.porEst[e.cod])}</span></div>`).join('')}</div></section>`}
    <section class="box"><h3>Satisfacción por dimensión</h3><div class="bars">${PREGUNTAS.map(p=>`<div class="bar"><span>${p.t}</span><span class="track"><span class="fill" style="width:${(ENCUESTAS.prom[p.id]/7*100).toFixed(0)}%"></span></span><span class="n">${dec(ENCUESTAS.prom[p.id])}</span></div>`).join('')}</div></section>
  </div>`;
}

/* ================= Eventos ================= */
function bind(){
  document.querySelectorAll('[data-pag]').forEach(b=>b.onclick=e=>{e.preventDefault(); st.pag=b.dataset.pag; if(st.pag!=='oirs'){st.enviado=null;} if(st.pag!=='encuesta') st.encuestaOk=false; render(); scrollTo(0,0);});
  document.querySelectorAll('[data-tipo]').forEach(b=>b.onclick=()=>{ st.tipo=b.dataset.tipo; st.errores={}; render(); $('#est')?.focus(); });
  const fo = $('#f-oirs');
  if(fo){
    const leer = () => { st.form = {est:$('#est').value, fat:$('#fat').value, desc:$('#desc').value, pet:$('#pet')?.value||'', nom:$('#nom').value, mail:$('#mail').value, tel:$('#tel').value, edad:$('#edad')?.value||'', sexo:$('#sexo')?.value||'', autem:$('#autem').checked, acepta:$('#acepta').checked}; };
    fo.oninput = leer;
    fo.onsubmit = e => { e.preventDefault(); leer(); const f=st.form, er={}, idReq=TIPOS[st.tipo].id;
      if(!f.est) er.est='Selecciona el establecimiento.';
      if(f.desc.trim().length<10) er.desc='Describe la situación con al menos 10 caracteres.';
      if(idReq && !f.nom.trim()) er.nom='Necesitamos tu nombre para responderte.';
      if(f.mail && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(f.mail)) er.mail='Revisa el formato del correo (ej.: nombre@correo.cl).';
      if(f.tel && !/^\+?[\d\s]{8,15}$/.test(f.tel)) er.tel='Revisa el teléfono (ej.: +56 9 1234 5678).';
      if(idReq && !f.mail && !f.tel) er.mail='Indica un correo o un teléfono para poder responderte.';
      if(!f.acepta) er.acepta='Debes aceptar el uso de datos para enviar la solicitud.';
      st.errores = er;
      if(Object.keys(er).length){ render(); $('#err-sum')?.focus(); return; }
      const sol = f.nom ? {nombre:f.nom, email:f.mail, tel:f.tel, autorizaEmail:f.autem} : null;
      const r = {folio:nuevoFolio(), tipo:st.tipo, est:f.est, ingreso:HOY, vence:sumarHabiles(HOY,15), estado:'INGRESADO', desc:f.desc, cat:null, unidad:null, canal:'WEB', sol, historial:[{f:HOY,a:'Ingreso',e:'INGRESADO',u:'Sistema (canal web)'}], respuesta:null};
      REQS.unshift(r); st.enviado=r; st.form={}; st.tipo=null; render(); scrollTo(0,0); };
  }
  document.querySelectorAll('[data-ir]').forEach(a=>a.onclick=ev=>{ ev.preventDefault(); $('#'+a.dataset.ir)?.focus(); });
  $('#otra') && ($('#otra').onclick=()=>{st.enviado=null; render();});
  const fe = $('#f-enc');
  if(fe){
    fe.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{ st.encuesta.r[b.dataset.p]=+b.dataset.v; st.encuesta.est=$('#enc-est').value; st.encuesta.comentario=$('#enc-com').value; render(); });
    fe.onsubmit = e => { e.preventDefault(); st.encuesta.est=$('#enc-est').value; st.encuesta.comentario=$('#enc-com').value;
      if(!st.encuesta.est || PREGUNTAS.some(p=>!st.encuesta.r[p.id])){ toast('Completa el establecimiento y las 5 preguntas.'); return; }
      ENCUESTAS.n++; st.encuesta={est:'',r:{},comentario:''}; st.encuestaOk=true; render(); scrollTo(0,0); };
  }
  // Login
  document.querySelectorAll('[data-demo]').forEach(b=>b.onclick=()=>entrar(USUARIOS[+b.dataset.demo]));
  $('#f-login') && ($('#f-login').onsubmit=e=>{ e.preventDefault(); const u=USUARIOS.find(x=>x.email===$('#lg-mail').value.trim().toLowerCase()); if(u && $('#lg-pass').value.length>=8 && u.activo) entrar(u); else $('#lg-err').hidden=false; });
  $('#f-mfa') && ($('#f-mfa').onsubmit=e=>{ e.preventDefault(); if(/^\d{6}$/.test($('#totp').value)){ st.usuario=st.mfaPendiente; st.mfaPendiente=null; st.vista='bandeja'; render(); } else toast('El código debe tener 6 dígitos.'); });
  $('#mfa-cancel') && ($('#mfa-cancel').onclick=()=>{st.mfaPendiente=null; render();});
  $('#salir') && ($('#salir').onclick=salir); $('#salir-m') && ($('#salir-m').onclick=salir);
  document.querySelectorAll('[data-vista]').forEach(b=>b.onclick=()=>{ st.vista=b.dataset.vista; render(); });
  document.querySelectorAll('[data-folio]').forEach(el=>{ const go=()=>{ st.folio=el.dataset.folio; st.vista='detalle'; render(); scrollTo(0,0); }; el.onclick=go; el.onkeydown=e=>{ if(e.key==='Enter') go(); }; });
  ['fq','fe','ft'].forEach(id=>{ const el=$('#'+id); if(el) el.oninput=()=>{ st.filtros={...st.filtros, q:$('#fq').value, estado:$('#fe').value, tipo:$('#ft').value}; const pos=el.selectionStart; render(); const n=$('#'+id); n.focus(); if(id==='fq'&&pos!=null) n.setSelectionRange(pos,pos); }; });
  document.querySelectorAll('[data-sem]').forEach(b=>b.onclick=()=>{ st.filtros={...st.filtros, estado:'ABIERTOS', sem:b.dataset.sem}; render(); });
  // Acciones del detalle
  const r = REQS.find(x=>x.folio===st.folio);
  $('#a-derivar') && ($('#a-derivar').onclick=()=>$('#dlg-derivar').showModal());
  $('#a-responder') && ($('#a-responder').onclick=()=>$('#dlg-resp').showModal());
  $('#a-cerrar') && ($('#a-cerrar').onclick=()=>$('#dlg-cerrar').showModal());
  $('#dlg-cerrar') && ($('#dlg-cerrar').onclose=()=>{ if($('#dlg-cerrar').returnValue!=='ok') return; r.estado='CERRADO'; r.historial.push({f:HOY,a:'Caso cerrado',e:'CERRADO',u:st.usuario.nombre}); toast(`Caso ${r.folio} cerrado.`); render(); });
  $('#dlg-derivar') && ($('#dlg-derivar').onclose=()=>{ if($('#dlg-derivar').returnValue!=='ok') return; const c=$('#d-cat').value, un=$('#d-uni').value; if(!c||!un){ toast('Selecciona motivo y unidad.'); return; }
    r.cat=c; r.unidad=un; r.estado='EN_PROCESO'; r.historial.push({f:HOY,a:`Clasificado como «${c}» y derivado a ${un}`,e:'EN_PROCESO',u:st.usuario.nombre}); toast(`Derivado a ${un}.`); render(); });
  $('#dlg-resp') && ($('#dlg-resp').onclose=()=>{ if($('#dlg-resp').returnValue!=='ok') return; const t=$('#r-txt').value.trim(), fch=$('#r-fecha').value; if(t.length<20){ toast('La respuesta debe tener al menos 20 caracteres.'); return; }
    const dentro = fch<=r.vence; r.respuesta={medio:$('#r-medio').value, fecha:fch, texto:t}; r.estado='RESPONDIDO'; r.historial.push({f:fch,a:`Respuesta registrada (${dentro?'dentro':'fuera'} de plazo)`,e:'RESPONDIDO',u:st.usuario.nombre}); toast('Respuesta registrada.'); render(); });
  // Ingreso presencial
  $('#f-pres') && ($('#f-pres').onsubmit=e=>{ e.preventDefault(); const d=$('#pr-desc').value.trim(); if(d.length<10){ const er=$('#pr-err'); er.textContent='La descripción debe tener al menos 10 caracteres.'; er.hidden=false; return; }
    const nom=$('#pr-nom').value.trim(), con=$('#pr-tel').value.trim();
    const r={folio:nuevoFolio(), tipo:$('#pr-tipo').value, est:st.usuario.est, ingreso:HOY, vence:sumarHabiles(HOY,15), estado:'INGRESADO', desc:d, cat:null, unidad:null, canal:'PRESENCIAL', sol: nom?{nombre:nom,email:con.includes('@')?con:'',tel:con.includes('@')?'':con,autorizaEmail:false}:null, historial:[{f:HOY,a:'Ingreso presencial',e:'INGRESADO',u:st.usuario.nombre}], respuesta:null};
    REQS.unshift(r); toast(`Registrado con folio ${r.folio}.`); st.folio=r.folio; st.vista='detalle'; render(); });
  // Reportes / usuarios
  $('#exportar') && ($('#exportar').onclick=()=>toast(`CSV generado con ${visibles(st.usuario).length} filas, sin datos personales. (En el prototipo no se descarga.)`));
  $('#periodo') && ($('#periodo').onchange=()=>{ st.periodo=+$('#periodo').value; render(); });
  $('#nuevo-u') && ($('#nuevo-u').onclick=()=>$('#dlg-u').showModal());
  $('#u-rol') && ($('#u-rol').onchange=()=>{ $('#u-est-f').hidden = !['OIRS_EST','DIRECCION'].includes($('#u-rol').value); });
  $('#dlg-u') && ($('#dlg-u').onclose=()=>{ if($('#dlg-u').returnValue!=='ok') return; const rol=$('#u-rol').value, est=$('#u-est').value, nom=$('#u-nom').value.trim(), mail=$('#u-mail').value.trim().toLowerCase();
    if(!nom||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail)){ toast('Completa nombre y un correo válido.'); return; }
    if(['OIRS_EST','DIRECCION'].includes(rol)&&!est){ toast('Este perfil requiere un establecimiento.'); return; }
    if(USUARIOS.some(u=>u.email===mail)){ toast('Ya existe un usuario con ese correo.'); return; }
    const txt={OIRS_EST:'Encargado OIRS',DIRECCION:'Dirección de establecimiento',OIRS_DSM:'Encargado OIRS Departamento',ADMIN:'Administrador del sistema'}[rol];
    USUARIOS.push({email:mail,nombre:nom,rol,rolTxt:txt,est:['OIRS_EST','DIRECCION'].includes(rol)?est:null,activo:true,mfa:['ADMIN','OIRS_DSM'].includes(rol)}); toast(`Usuario ${mail} creado.`); render(); });
  document.querySelectorAll('[data-toggle-u]').forEach(b=>b.onclick=()=>{ const x=USUARIOS[+b.dataset.toggleU]; x.activo=!x.activo; toast(`${x.nombre}: ${x.activo?'activado':'desactivado'}.`); render(); });
}
function entrar(u){ if(!u.activo){ toast('La cuenta está desactivada.'); return; } if(u.mfa){ st.mfaPendiente=u; render(); $('#totp')?.focus(); return; } st.usuario=u; st.vista='bandeja'; render(); }
function salir(){ st.usuario=null; st.folio=null; st.filtros={estado:'ABIERTOS',tipo:'',q:'',sem:''}; render(); toast('Sesión cerrada.'); }
$('#ver-portal').onclick=()=>{ st.modo='portal'; render(); };
$('#ver-admin').onclick=()=>{ st.modo='admin'; render(); };
render();
</script>
