# Encuesta de satisfacción servida por Nginx, sin WordPress (solo para demostración).
# Cumple el mismo papel que el plugin: entrega la página al ciudadano y firma con HMAC-SHA256, en el servidor,
# las llamadas a la API pública del Sistema de Gestión OIRS. El navegador nunca conoce el secreto (SC-05).
load_module modules/ngx_http_js_module.so;

user nginx;
worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

env OIRS_HMAC_SECRET;            # njs lo lee con process.env; no se escribe en ningún archivo
env OIRS_API_URL;

events { worker_connections 256; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;
    server_tokens off;
    sendfile on;

    # Anonimato de la encuesta: el registro de accesos no guarda la IP del ciudadano.
    log_format anonimo '[$time_local] "$request" $status $body_bytes_sent';
    access_log /var/log/nginx/access.log anonimo;

    # Mismo límite que el plugin: ráfaga de 10 envíos y luego 1 por minuto por IP (solo en memoria).
    limit_req_zone $binary_remote_addr zone=envios:1m rate=1r/m;
    limit_req_status 429;
    limit_req_log_level info;    # no se escribe en el registro (nivel warn): evita guardar la IP del ciudadano

    js_path /etc/nginx/njs;
    js_import oirs from oirs.js;
    resolver 127.0.0.11 ipv6=off valid=30s;                 # DNS interno de Docker (servicio «nginx»)
    js_fetch_trusted_certificate /etc/oirs/ca.crt;          # CA local: la verificación TLS no se desactiva
    js_fetch_timeout 10s;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;

        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        location = / { try_files /index.html =404; }

        # Recursos compartidos con el plugin y el tema: una sola hoja de estilos para ambos canales.
        location = /oirs.css { alias /srv/plugin/oirs.css; }
        location = /logo.svg { alias /srv/tema/logo.svg; }

        # Intermediario firmado: el navegador llama a estas rutas y njs reenvía a la API con la firma.
        location = /api/catalogos { js_content oirs.catalogos; }
        location = /api/encuesta  { js_content oirs.definicion; }
        location = /api/respuestas {
            limit_req zone=envios burst=10 nodelay;
            client_max_body_size 8k;
            client_body_buffer_size 8k;                     # el cuerpo queda en memoria para firmarlo
            js_content oirs.responder;
        }
        location /api/ { return 404; }

        error_page 429 = @limite;
        location @limite {
            default_type application/json;
            return 429 '{"error":"Demasiados envíos desde este equipo. Intente más tarde."}';
        }
    }
}
