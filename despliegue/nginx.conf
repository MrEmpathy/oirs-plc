limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;   # contexto http
server { listen 80; server_name oirs.salud.padrelascasas.cl; return 301 https://$host$request_uri; }
server {
  listen 443 ssl http2;
  server_name oirs.salud.padrelascasas.cl;
  ssl_certificate /etc/nginx/certs/fullchain.pem;  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  client_max_body_size 1m;
  location /api/v1/sesion/iniciar { limit_req zone=login burst=3 nodelay; proxy_pass http://app:8000; include proxy_params; }
  location /static/ { alias /srv/static/; }
  location / { proxy_pass http://app:8000; proxy_set_header X-Forwarded-Proto https; proxy_set_header Host $host; }
}
